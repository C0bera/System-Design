  /v1/stocks/{symbol}/history:
    get:
      tags:
      - Market data
      summary: Daily price history, split-adjusted
      description: 'At most about 1,260 bars (5y), so the response has no pagination.

        STUB: returns the few stored bars for AAPL and no splits apply.'
      operationId: getStockHistory
      security:
      - bearerAuth: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9.\-]{0,9}$
          description: Case-insensitive symbol
          examples:
          - AAPL
          title: Symbol
        description: Case-insensitive symbol
      - name: range
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/HistoryRange'
          description: Bounded by 5 years of retained daily bars
          default: 1y
        description: Bounded by 5 years of retained daily bars
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistory'
        '400':
          description: Invalid symbol or range
          content:
            application/json:
              examples:
                invalid_symbol:
                  value:
                    error:
                      code: invalid_symbol
                      message: 'symbol: String should match pattern ''^[A-Za-z][A-Za-z0-9.\-]{0,9}$'''
                invalid_range:
                  value:
                    error:
                      code: invalid_range
                      message: 'range: Input should be ''1m'', ''3m'', ''6m'', ''ytd'', ''1y'' or ''5y'''
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              examples:
                authentication_required:
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
