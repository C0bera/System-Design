                  value:
                    error:
                      code: market_data_unavailable
                      message: Market data is temporarily unavailable, retry
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/watchlist/items:
    get:
      tags:
      - Watchlist
      summary: Read my Watchlist
      description: 'The Watchlist is selected only by the verified User ID. A User with no

        Watchlist yet gets an empty page. Order: newest addedAt first, then symbol. STUB.'
      operationId: listWatchlistItems
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Page size, 1-50
          default: 20
          title: Limit
        description: Page size, 1-50
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
          description: nextCursor from the previous page
          title: Cursor
        description: nextCursor from the previous page
      responses:
        '200':
          description: One page of the caller's Watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistPage'
              examples:
                page:
                  summary: limit=20, two items
                  value:
                    items:
                    - symbol: PLTR
                      name: Palantir Technologies Inc. - Class A Common Stock
                      active: true
                      addedAt: '2026-11-10T15:16:02Z'
                      quote:
                        price: '182.40'
                        previousClose: '171.25'
                        change: '11.15'
                        changePercent: '6.51'
                        dayVolume: 96900000
                        currency: USD
                        priceState: delayed
                        unavailableReason: null
                        providerTime: '2026-11-10T15:00:00Z'
                    - symbol: SOFI
                      name: SoFi Technologies, Inc. - Common Stock
                      active: true
                      addedAt: '2026-11-10T15:15:41Z'
                      quote:
                        price: null
                        previousClose: null
                        change: null
                        changePercent: null
                        dayVolume: null
                        currency: USD
                        priceState: unavailable
                        unavailableReason: stale
                        providerTime: '2026-11-10T14:40:00Z'
                    itemCount: 2
                    capacity: 100
                    nextCursor: null
                empty:
                  summary: New User, nothing added yet
                  value:
                    items: []
                    itemCount: 0
                    capacity: 100
                    nextCursor: null
        '400':
          description: Invalid limit or cursor
          content:
            application/json:
              examples:
                invalid_limit:
                  value:
                    error:
                      code: invalid_limit
                      message: 'limit: Input should be less than or equal to 50'
                invalid_cursor:
                  value:
                    error:
                      code: invalid_cursor
                      message: cursor is not valid for these filters; start from the first page
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              examples:
                authentication_required:
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit reached
          content:
            application/json:
              examples:
                rate_limited:
                  value:
                    error:
                      code: rate_limited
                      message: Too many requests; retry after the Retry-After interval
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Seconds to wait before the next request
              schema:
                type: integer
        '503':
          description: Watchlist store unavailable, or the latest confirmed change cannot be guaranteed (CON-2)
          content:
            application/json:
              examples:
                watchlist_unavailable:
                  value:
                    error:
                      code: watchlist_unavailable
                      message: Watchlist is temporarily unavailable, retry
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Watchlist
      summary: Add a Stock to my Watchlist
      description: Success is returned only after the User Data Store confirms the write. STUB.
      operationId: addWatchlistItem
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistItemCreate'
      responses:
        '201':
          description: Added; the change is confirmed by the User Data Store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistItem'
          headers:
            Location:
              description: URL of the new item
              schema:
                type: string
              example: /v1/watchlist/items/PLTR
        '400':
          description: Invalid body, unsupported symbol, or delisted Stock
          content:
            application/json:
              examples:
                invalid_json:
                  value:
                    error:
                      code: invalid_json
                      message: Request body is not valid JSON
                missing_field:
                  value:
                    error:
                      code: missing_field
                      message: symbol is required
                unknown_field:
                  value:
                    error:
                      code: unknown_field
                      message: userId is not an accepted field
                invalid_symbol:
                  value:
                    error:
                      code: invalid_symbol
                      message: 'symbol: String should match pattern ''^[A-Za-z][A-Za-z0-9.\-]{0,9}$'''
                unsupported_symbol:
                  value:
                    error:
                      code: unsupported_symbol
                      message: ABCD is not a supported Stock
                stock_delisted:
                  value:
                    error:
                      code: stock_delisted
                      message: TWTR is delisted and cannot be added
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              examples:
                authentication_required:
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The change conflicts with the Watchlist state
          content:
            application/json:
              examples:
                already_on_watchlist:
                  value:
                    error:
                      code: already_on_watchlist
                      message: PLTR is already on your Watchlist
                watchlist_full:
                  value:
                    error:
                      code: watchlist_full
                      message: A Watchlist holds at most 100 Stocks
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit reached
          content:
            application/json:
              examples:
                rate_limited:
                  value:
                    error:
                      code: rate_limited
                      message: Too many requests; retry after the Retry-After interval
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Seconds to wait before the next request
              schema:
                type: integer
        '503':
          description: Watchlist store unavailable, or the latest confirmed change cannot be guaranteed (CON-2)
          content:
            application/json:
              examples:
                watchlist_unavailable:
                  value:
                    error:
                      code: watchlist_unavailable
                      message: Watchlist is temporarily unavailable, retry
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/watchlist/items/{symbol}:
    get:
      tags:
      - Watchlist
      summary: Check whether a Stock is on my Watchlist
      description: STUB.
      operationId: getWatchlistItem
      security:
      - bearerAuth: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9.\-]{0,9}$
          description: Case-insensitive symbol
          examples:
          - AAPL
          title: Symbol
        description: Case-insensitive symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistItem'
        '400':
          description: Invalid symbol
          content:
            application/json:
              examples:
                invalid_symbol:
                  value:
                    error:
                      code: invalid_symbol
                      message: 'symbol: String should match pattern ''^[A-Za-z][A-Za-z0-9.\-]{0,9}$'''
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              examples:
                authentication_required:
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The Stock is not on the caller's Watchlist
          content:
            application/json:
              examples:
                not_on_watchlist:
                  value:
                    error:
                      code: not_on_watchlist
                      message: PLTR is not on your Watchlist
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit reached
          content:
            application/json:
              examples:
                rate_limited:
                  value:
                    error:
                      code: rate_limited
                      message: Too many requests; retry after the Retry-After interval
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Seconds to wait before the next request
              schema:
                type: integer
        '503':
          description: Watchlist store unavailable, or the latest confirmed change cannot be guaranteed (CON-2)
          content:
            application/json:
              examples:
                watchlist_unavailable:
                  value:
                    error:
                      code: watchlist_unavailable
                      message: Watchlist is temporarily unavailable, retry
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Watchlist
      summary: Remove a Stock from my Watchlist
      description: STUB.
      operationId: removeWatchlistItem
      security:
      - bearerAuth: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9.\-]{0,9}$
          description: Case-insensitive symbol
          examples:
          - AAPL
          title: Symbol
        description: Case-insensitive symbol
      responses:
        '204':
          description: Removed; the change is confirmed by the User Data Store
        '400':
          description: Invalid symbol
          content:
            application/json:
              examples:
                invalid_symbol:
                  value:
                    error:
                      code: invalid_symbol
                      message: 'symbol: String should match pattern ''^[A-Za-z][A-Za-z0-9.\-]{0,9}$'''
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              examples:
                authentication_required:
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The Stock is not on the caller's Watchlist
          content:
            application/json:
              examples:
                not_on_watchlist:
                  value:
                    error:
                      code: not_on_watchlist
                      message: PLTR is not on your Watchlist
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit reached
          content:
            application/json:
              examples:
                rate_limited:
                  value:
                    error:
                      code: rate_limited
                      message: Too many requests; retry after the Retry-After interval
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Seconds to wait before the next request
              schema:
                type: integer
        '503':
          description: Watchlist store unavailable, or the latest confirmed change cannot be guaranteed (CON-2)
          content:
            application/json:
              examples:
                watchlist_unavailable:
                  value:
                    error:
                      code: watchlist_unavailable
                      message: Watchlist is temporarily unavailable, retry
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    DailyBar:
      properties:
        date:
          type: string
          format: date
          title: Date
        open:
          type: string
          pattern: ^-?\d+\.\d{2}$
          title: Open
          examples:
          - '229.35'
        high:
          type: string
          pattern: ^-?\d+\.\d{2}$
          title: High
          examples:
          - '229.35'
        low:
          type: string
          pattern: ^-?\d+\.\d{2}$
          title: Low
          examples:
          - '229.35'
        close:
          type: string
          pattern: ^-?\d+\.\d{2}$
          title: Close
          examples:
          - '229.35'
        volume:
          type: integer
          minimum: 0.0
          title: Volume
      type: object
      required:
      - date
      - open
      - high
      - low
      - close
      - volume
      title: DailyBar
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
          description: Stable machine-readable code; the client selects behavior by it
          examples:
          - invalid_type
        message:
          type: string
          title: Message
          description: Human-readable explanation
          examples:
          - 'type: Input should be ''stock'' or ''etf'''
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorResponse
    Exchange:
      type: string
      enum:
      - nasdaq
      - nyse
      - nyse_american
      - nyse_arca
      - cboe_bzx
      title: Exchange
    HistoryRange:
      type: string
      enum:
      - 1m
      - 3m
      - 6m
      - ytd
      - 1y
      - 5y
      title: HistoryRange
    MarketOverview:
      properties:
        market:
          type: string
          const: US
          title: Market
          default: US
        gainers:
          items:
            $ref: '#/components/schemas/OverviewRow'
          type: array
          title: Gainers
          description: Up to 10, highest positive changePercent first
        losers:
          items:
            $ref: '#/components/schemas/OverviewRow'
          type: array
          title: Losers
          description: Up to 10, lowest negative changePercent first
        mostActive:
          items:
            $ref: '#/components/schemas/OverviewRow'
          type: array
          title: Mostactive
          description: Up to 10, highest dayVolume first
        builtAt:
          type: string
          format: date-time
          title: Builtat
          description: Time of the source read (Lab 4 cached_at)
      type: object
      required:
      - gainers
      - losers
      - mostActive
      - builtAt
      title: MarketOverview
    OverviewRow:
      properties:
        symbol:
          type: string
          title: Symbol
        name:
          type: string
          title: Name
        quote:
          $ref: '#/components/schemas/Quote'
      type: object
      required:
      - symbol
      - name
      - quote
      title: OverviewRow
    PriceHistory:
      properties:
        symbol:
          type: string
          title: Symbol
          examples:
          - AAPL
        range:
          $ref: '#/components/schemas/HistoryRange'
        adjusted:
          type: boolean
          title: Adjusted
          description: 'True: prices are split-adjusted (derived from StockSplit records)'
        currency:
          type: string
          const: USD
          title: Currency
          default: USD
        bars:
          items:
            $ref: '#/components/schemas/DailyBar'
          type: array
          title: Bars
          description: One bar per trading day, oldest first; empty for a new listing
      type: object
      required:
      - symbol
      - range
      - adjusted
      - bars
      title: PriceHistory
    PriceState:
      type: string
      enum:
      - delayed
      - at_close
      - unavailable
      title: PriceState
      description: Lab 2 CON-1, evaluated at read time from providerTime.
    Quote:
      properties:
        price:
          anyOf:
          - type: string
            pattern: ^-?\d+\.\d{2}$
            examples:
            - '229.35'
          - type: 'null'
          title: Price
          description: Latest accepted price in USD
        previousClose:
          anyOf:
          - type: string
            pattern: ^-?\d+\.\d{2}$
            examples:
            - '229.35'
          - type: 'null'
          title: Previousclose
          examples:
          - '227.50'
        change:
          anyOf:
          - type: string
            pattern: ^-?\d+\.\d{2}$
            examples:
            - '229.35'
          - type: 'null'
          title: Change
          description: 'Derived: price - previousClose'
          examples:
          - '1.85'
        changePercent:
          anyOf:
          - type: string
            pattern: ^-?\d+\.\d{2}$
            examples:
            - '229.35'
          - type: 'null'
          title: Changepercent
          description: 'Derived: change / previousClose x 100, rounded half-up to 2 decimals'
          examples:
          - '0.81'
        dayVolume:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Dayvolume
          description: Shares traded in the current session
          examples:
          - 18400000
        currency:
          type: string
          const: USD
          title: Currency
          default: USD
        priceState:
          $ref: '#/components/schemas/PriceState'
        unavailableReason:
          anyOf:
          - $ref: '#/components/schemas/UnavailableReason'
          - type: 'null'
          description: Set only when priceState is unavailable
          examples:
          - null
        providerTime:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Providertime
          description: Time the provider assigned to the price (not the time the Dashboard received it)
          examples:
          - '2026-11-10T15:00:00Z'
      type: object
      required:
      - price
      - previousClose
      - change
      - changePercent
      - dayVolume
      - priceState
      - unavailableReason
      - providerTime
      title: Quote
      description: 'Latest accepted price with its derived values and freshness state.


        When priceState is unavailable, every price field is null; an old price is

        never returned as current. providerTime still shows the last accepted price

        time, or null when no price was ever accepted.'
    Sector:
      type: string
      enum:
      - communication_services
      - consumer_discretionary
      - consumer_staples
      - energy
      - financials
      - health_care
      - industrials
      - information_technology
      - materials
      - real_estate
      - utilities
      title: Sector
      description: GICS sectors. ETFs have no sector.
    SecurityType:
      type: string
      enum:
      - stock
      - etf
      title: SecurityType
    StockDetail:
      properties:
        symbol:
          type: string
          title: Symbol
          examples:
          - AAPL
        name:
          type: string
          title: Name
          examples:
          - Apple Inc. - Common Stock
        type:
          $ref: '#/components/schemas/SecurityType'
        exchange:
          $ref: '#/components/schemas/Exchange'
        sector:
          anyOf:
          - $ref: '#/components/schemas/Sector'
          - type: 'null'
        industry:
          anyOf:
          - type: string
          - type: 'null'
          title: Industry
          examples:
          - Technology Hardware, Storage & Peripherals
        active:
          type: boolean
          title: Active
        listedOn:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Listedon
          description: Null when the provider has no listing date
          examples:
          - '1980-12-12'
        delistedOn:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Delistedon
          examples:
          - null
      type: object
      required:
      - symbol
      - name
      - type
      - exchange
      - sector
      - industry
      - active
      - listedOn
      - delistedOn
      title: StockDetail
    StockPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/StockSummary'
          type: array
          title: Items
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
          description: Opaque token for the next page, or null at the end
          examples:
          - null
      type: object
      required:
      - items
      - nextCursor
      title: StockPage
    StockPrice:
      properties:
        symbol:
          type: string
          title: Symbol
          examples:
          - AAPL
        quote:
          $ref: '#/components/schemas/Quote'
      type: object
      required:
      - symbol
      - quote
      title: StockPrice
    StockSummary:
      properties:
        symbol:
          type: string
          title: Symbol
          examples:
          - AAPL
        name:
          type: string
          title: Name
          examples:
          - Apple Inc. - Common Stock
        type:
          $ref: '#/components/schemas/SecurityType'
        exchange:
          $ref: '#/components/schemas/Exchange'
        sector:
          anyOf:
          - $ref: '#/components/schemas/Sector'
          - type: 'null'
          description: Null for ETFs and unclassified Stocks
        active:
          type: boolean
          title: Active
          description: 'Derived: false when the Stock is delisted'
        quote:
          $ref: '#/components/schemas/Quote'
      type: object
      required:
      - symbol
      - name
      - type
      - exchange
      - sector
      - active
      - quote
      title: StockSummary
    TrendingList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TrendingStock'
          type: array
          title: Items
          description: Complete ranked result; there is no next page
        rankedAt:
          type: string
          format: date-time
          title: Rankedat
          description: Read time of the latest prices used for the ranking
      type: object
      required:
      - items
      - rankedAt
      title: TrendingList
    TrendingStock:
      properties:
        rank:
          type: integer
          minimum: 1.0
          title: Rank
          examples:
          - 1
        symbol:
          type: string
          title: Symbol
          examples:
          - PLTR
        name:
          type: string
          title: Name
          examples:
          - Palantir Technologies Inc. - Class A Common Stock
        type:
          $ref: '#/components/schemas/SecurityType'
        relativeVolume:
          type: string
          pattern: ^-?\d+\.\d{2}$
          title: Relativevolume
          description: 'Derived: dayVolume / averageVolume20d'
          examples:
          - '2.16'
        averageVolume20d:
          type: integer
          minimum: 0.0
          title: Averagevolume20D
          description: 'Derived: mean volume of the last 20 daily bars'
          examples:
          - 44800000
        quote:
          $ref: '#/components/schemas/Quote'
      type: object
      required:
      - rank
      - symbol
      - name
      - type
      - relativeVolume
      - averageVolume20d
      - quote
      title: TrendingStock
    UnavailableReason:
      type: string
      enum:
      - no_price
      - stale
      - delisted
      title: UnavailableReason
    WatchlistItem:
      properties:
        symbol:
          type: string
          title: Symbol
          examples:
          - PLTR
        name:
          type: string
          title: Name
          examples:
          - Palantir Technologies Inc. - Class A Common Stock
        active:
          type: boolean
          title: Active
          description: False for a delisted Stock; it stays until the User removes it
        addedAt:
          type: string
          format: date-time
          title: Addedat
          examples:
          - '2026-11-10T15:16:02Z'
        quote:
          $ref: '#/components/schemas/Quote'
      type: object
      required:
      - symbol
      - name
      - active
      - addedAt
      - quote
      title: WatchlistItem
    WatchlistItemCreate:
      properties:
        symbol:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9.\-]{0,9}$
          title: Symbol
          description: Case-insensitive; stored by Stock identity
          examples:
          - PLTR
      additionalProperties: false
      type: object
      required:
      - symbol
      title: WatchlistItemCreate
      description: Only input model. The owner comes from the access token, never from the body.
    WatchlistPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/WatchlistItem'
          type: array
          title: Items
          description: Newest addedAt first
        itemCount:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Itemcount
          description: 'Derived: number of items on the whole Watchlist'
          examples:
          - 2
        capacity:
          type: integer
          const: 100
          title: Capacity
          description: Maximum number of items on one Watchlist
          default: 100
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
          examples:
          - null
      type: object
      required:
      - items
      - itemCount
      - nextCursor
      title: WatchlistPage
  securitySchemes:
    bearerAuth:
      type: http
      description: Access token from the external identity provider (OIDC). The `sub` claim is the User ID.
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Market data
  description: Public market data; any signed-in User
- name: Watchlist
  description: Private; only the owner from the access token
