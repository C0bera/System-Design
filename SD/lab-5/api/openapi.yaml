openapi: 3.1.0
info:
  title: Personal Investment Dashboard API
  description: "\nMarket data and the private Watchlist for the Personal Investment Dashboard.\n\n* **Version:** major version\
    \ in the path (`/v1`). Compatible changes stay in v1.\n* **Authentication:** every operation needs `Authorization: Bearer\
    \ <access token>`\n  from the external identity provider. The owner of a Watchlist is the token subject.\n* **Errors:**\
    \ one shape, `{\"error\": {\"code\", \"message\"}}`. Invalid input is `400`.\n* **Pagination:** cursor lists take `limit`\
    \ (1-50, default 20) and `cursor`.\n  `nextCursor: null` means the end. A cursor is valid only with the same filters.\n\
    * **Rate limits:** `429` with `Retry-After` (seconds). Wait that long before a retry.\n"
  version: 1.0.0
servers:
- url: https://api.dashboard.example
  description: Production (example host)
- url: http://localhost:8000
  description: Local stub
paths:
  /v1/market/overview:
    get:
      tags:
      - Market data
      summary: 'US market overview: top gainers, top losers, most active'
      description: 'Each list has up to 10 rows. Stocks whose priceState is unavailable are left out.

        Ties are ordered by symbol. STUB.'
      operationId: getMarketOverview
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOverview'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authentication_required:
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue
        '429':
          description: Rate limit reached
          headers:
            Retry-After:
              description: Seconds to wait before the next request
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate_limited:
                  value:
                    error:
                      code: rate_limited
                      message: Too many requests; retry after the Retry-After interval
        '503':
          description: Market data store unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                market_data_unavailable:
                  value:
                    error:
                      code: market_data_unavailable
                      message: Market data is temporarily unavailable, retry
      security:
      - bearerAuth: []
  /v1/stocks:
    get:
      tags:
      - Market data
      summary: Browse, filter, and search active Stocks
      description: 'Filters are applied before the limit. Without `q`, the order is symbol A-Z.

        With `q`, the order is: exact symbol, symbol prefix, word prefix in the name,

        text inside the name; symbol A-Z inside each group. Delisted Stocks are left out. STUB.'
      operationId: listStocks
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 50
          - type: 'null'
          description: Search by symbol or name, case-insensitive
          examples:
          - apple
          title: Q
        description: Search by symbol or name, case-insensitive
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SecurityType'
          - type: 'null'
          description: Omit for stocks and ETFs
          title: Type
        description: Omit for stocks and ETFs
      - name: exchange
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Exchange'
          - type: 'null'
          title: Exchange
      - name: sector
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Sector'
          - type: 'null'
          description: ETFs have no sector, so they never match
          title: Sector
        description: ETFs have no sector, so they never match
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Page size, 1-50
          default: 20
          title: Limit
        description: Page size, 1-50
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
          description: nextCursor from the previous page
          title: Cursor
        description: nextCursor from the previous page
      responses:
        '200':
          description: One page of matching Stocks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPage'
              examples:
                filtered:
                  summary: type=stock&sector=information_technology&limit=2 (first page)
                  value:
                    items:
                    - symbol: AAPL
                      name: Apple Inc. - Common Stock
                      type: stock
                      exchange: nasdaq
                      sector: information_technology
                      active: true
                      quote:
                        price: '229.35'
                        previousClose: '227.50'
                        change: '1.85'
                        changePercent: '0.81'
                        dayVolume: 18400000
                        currency: USD
                        priceState: delayed
                        unavailableReason: null
                        providerTime: '2026-11-10T15:00:00Z'
                    - symbol: INTC
                      name: Intel Corporation - Common Stock
                      type: stock
                      exchange: nasdaq
                      sector: information_technology
                      active: true
                      quote:
                        price: '22.40'
                        previousClose: '23.14'
                        change: '-0.74'
                        changePercent: '-3.20'
                        dayVolume: 61800000
                        currency: USD
                        priceState: delayed
                        unavailableReason: null
                        providerTime: '2026-11-10T15:00:00Z'
                    nextCursor: eyJhZnRlciI6IFswLCAiSU5UQyJdLCAiZiI6ICJlNGNmNjVmMWVkZDQifQ
                empty:
                  summary: q=zzzz (no match)
                  value:
                    items: []
                    nextCursor: null
        '400':
          description: Invalid filter, query, limit, or cursor
          content:
            application/json:
              examples:
                invalid_type:
                  value:
                    error:
                      code: invalid_type
                      message: 'type: Input should be ''stock'' or ''etf'''
                invalid_query:
                  value:
                    error:
                      code: invalid_query
                      message: 'q: String should have at least 1 character'
                invalid_limit:
                  value:
                    error:
                      code: invalid_limit
                      message: 'limit: Input should be less than or equal to 50'
                invalid_cursor:
                  value:
                    error:
                      code: invalid_cursor
                      message: cursor is not valid for these filters; start from the first page
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              examples:
                authentication_required:
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit reached
          content:
            application/json:
              examples:
                rate_limited:
                  value:
                    error:
                      code: rate_limited
                      message: Too many requests; retry after the Retry-After interval
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Seconds to wait before the next request
              schema:
                type: integer
        '503':
          description: Market data store unavailable
          content:
            application/json:
              examples:
                market_data_unavailable:
                  value:
                    error:
                      code: market_data_unavailable
                      message: Market data is temporarily unavailable, retry
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/stocks/trending:
    get:
      tags:
      - Market data
      summary: Stocks ranked by relative volume
      description: 'relativeVolume = dayVolume / averageVolume20d, highest first, ties by symbol.

        Only active Stocks with a usable price (priceState not unavailable), 20 daily

        bars, and averageVolume20d >= 1,000,000 are ranked. One page only. STUB.'
      operationId: listTrendingStocks
      security:
      - bearerAuth: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SecurityType'
          - type: 'null'
          description: Omit for stocks and ETFs
          title: Type
        description: Omit for stocks and ETFs
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Number of ranked Stocks, 1-50
          default: 20
          title: Limit
        description: Number of ranked Stocks, 1-50
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendingList'
        '400':
          description: Invalid limit or type
          content:
            application/json:
              examples:
                invalid_limit:
                  value:
                    error:
                      code: invalid_limit
                      message: 'limit: Input should be less than or equal to 50'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              examples:
                authentication_required:
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit reached
          content:
            application/json:
              examples:
                rate_limited:
                  value:
                    error:
                      code: rate_limited
                      message: Too many requests; retry after the Retry-After interval
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Seconds to wait before the next request
              schema:
                type: integer
        '503':
          description: Market data store unavailable
          content:
            application/json:
              examples:
                market_data_unavailable:
                  value:
                    error:
                      code: market_data_unavailable
                      message: Market data is temporarily unavailable, retry
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/stocks/{symbol}:
    get:
      tags:
      - Market data
      summary: Stock reference data
      description: A delisted Stock is still returned, with active false. STUB.
      operationId: getStock
      security:
      - bearerAuth: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9.\-]{0,9}$
          description: Case-insensitive symbol
          examples:
          - AAPL
          title: Symbol
        description: Case-insensitive symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDetail'
        '400':
          description: Invalid symbol
          content:
            application/json:
              examples:
                invalid_symbol:
                  value:
                    error:
                      code: invalid_symbol
                      message: 'symbol: String should match pattern ''^[A-Za-z][A-Za-z0-9.\-]{0,9}$'''
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              examples:
                authentication_required:
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No supported Stock has this symbol
          content:
            application/json:
              examples:
                stock_not_found:
                  value:
                    error:
                      code: stock_not_found
                      message: No supported Stock has symbol ABCD
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit reached
          content:
            application/json:
              examples:
                rate_limited:
                  value:
                    error:
                      code: rate_limited
                      message: Too many requests; retry after the Retry-After interval
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Seconds to wait before the next request
              schema:
                type: integer
        '503':
          description: Market data store unavailable
          content:
            application/json:
              examples:
                market_data_unavailable:
                  value:
                    error:
                      code: market_data_unavailable
                      message: Market data is temporarily unavailable, retry
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/stocks/{symbol}/price:
