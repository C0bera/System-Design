              examples:
                rate_limited:
                  value:
                    error:
                      code: rate_limited
                      message: Too many requests; retry after the Retry-After interval
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Seconds to wait before the next request
              schema:
                type: integer
        '503':
          description: Market data store unavailable
          content:
            application/json:
              examples:
