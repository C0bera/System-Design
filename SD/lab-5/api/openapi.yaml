          type: string
          pattern: ^[A-Za-z][A-Za-z0-9.\-]{0,9}$
          description: Case-insensitive symbol
          examples:
          - AAPL
          title: Symbol
        description: Case-insensitive symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPrice'
        '400':
          description: Invalid symbol
